<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1360" font-family="Noto Sans Thai, Waree, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowMsg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1650" height="1360" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="825" y="24" text-anchor="middle" font-size="20" font-weight="bold" fill="#212121">Production Monitoring System — Data Flow</text>
  <text x="825" y="42" text-anchor="middle" font-size="12" fill="#616161">Commissioning → Steady-state telemetry → Watchdog → Dashboard query (MQTT / REST / WebSocket)</text>

  <!-- ===== Participant headers (top) ===== -->
  <!-- Admin -->
  <rect x="15" y="60" width="150" height="55" rx="7" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
  <text x="90" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#263238">Admin</text>
  <text x="90" y="98" text-anchor="middle" font-size="9" fill="#37474F">(ผู้ดูแลระบบ)</text>

  <!-- Dashboard -->
  <rect x="190" y="60" width="150" height="55" rx="7" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="265" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A148C">Dashboard</text>
  <text x="265" y="98" text-anchor="middle" font-size="9" fill="#4A148C">(React)</text>

  <!-- REST -->
  <rect x="365" y="60" width="150" height="55" rx="7" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
  <text x="440" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#33691E">Backend REST API</text>
  <text x="440" y="98" text-anchor="middle" font-size="9" fill="#33691E">(Node.js / TypeScript)</text>

  <!-- Docker -->
  <rect x="540" y="60" width="150" height="55" rx="7" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
  <text x="615" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#263238">Docker Engine</text>
  <text x="615" y="98" text-anchor="middle" font-size="9" fill="#37474F">(Host)</text>

  <!-- Sim -->
  <rect x="715" y="60" width="150" height="55" rx="7" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="790" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D47A1">Machine Simulator</text>
  <text x="790" y="98" text-anchor="middle" font-size="9" fill="#0D47A1">(Node.js / mqtt.js)</text>

  <!-- MQTT -->
  <rect x="890" y="60" width="150" height="55" rx="7" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="965" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">MQTT Broker</text>
  <text x="965" y="98" text-anchor="middle" font-size="9" fill="#8D6E00">(Mosquitto)</text>

  <!-- Sub -->
  <rect x="1065" y="60" width="150" height="55" rx="7" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
  <text x="1140" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#33691E">MQTT Subscriber</text>
  <text x="1140" y="98" text-anchor="middle" font-size="9" fill="#33691E">(Zod validator)</text>

  <!-- DB -->
  <rect x="1240" y="60" width="150" height="55" rx="7" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1315" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">PostgreSQL</text>
  <text x="1315" y="98" text-anchor="middle" font-size="9" fill="#1B5E20">(Database)</text>

  <!-- WS -->
  <rect x="1415" y="60" width="150" height="55" rx="7" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
  <text x="1490" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#33691E">WebSocket /live</text>
  <text x="1490" y="98" text-anchor="middle" font-size="9" fill="#33691E">(real-time push)</text>

  <!-- ===== Lifelines ===== -->
  <g stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="4,3">
    <line x1="90" y1="115" x2="90" y2="1290"/>
    <line x1="265" y1="115" x2="265" y2="1290"/>
    <line x1="440" y1="115" x2="440" y2="1290"/>
    <line x1="615" y1="115" x2="615" y2="1290"/>
    <line x1="790" y1="115" x2="790" y2="1290"/>
    <line x1="965" y1="115" x2="965" y2="1290"/>
    <line x1="1140" y1="115" x2="1140" y2="1290"/>
    <line x1="1315" y1="115" x2="1315" y2="1290"/>
    <line x1="1490" y1="115" x2="1490" y2="1290"/>
  </g>

  <!-- ===== Phase 1: Commissioning ===== -->
  <rect x="15" y="140" width="675" height="28" rx="4" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
  <text x="352" y="159" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5D4037">1) Commissioning — เพิ่มเครื่องจักรใหม่</text>

  <g font-size="10" fill="#212121">
    <line x1="90" y1="200" x2="265" y2="200" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="177" y="194" text-anchor="middle">เลือก ERP asset + กด Add Machine</text>

    <line x1="265" y1="232" x2="440" y2="232" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="352" y="226" text-anchor="middle">POST /admin/machines {assetId, dataSource}</text>

    <line x1="440" y1="264" x2="1315" y2="264" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="877" y="258" text-anchor="middle">insert machines row</text>

    <line x1="440" y1="296" x2="615" y2="296" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="527" y="290" text-anchor="middle">ensureSimulatorContainer() ผ่าน docker.sock</text>

    <line x1="615" y1="328" x2="790" y2="328" stroke="#333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowMsg)"/>
    <text x="702" y="322" text-anchor="middle">start container simulator-{machineId}</text>

    <line x1="790" y1="360" x2="440" y2="360" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="615" y="354" text-anchor="middle">POST /erp/machine-assets/{id}/bootstrap (self-register spec)</text>

    <line x1="440" y1="392" x2="1315" y2="392" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="877" y="386" text-anchor="middle">upsert erp_machine_assets</text>

    <line x1="790" y1="424" x2="440" y2="424" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="615" y="418" text-anchor="middle">POST /admin/machines (idempotent, tolerate 409)</text>
  </g>

  <!-- ===== Phase 2: Steady state ===== -->
  <rect x="715" y="456" width="850" height="28" rx="4" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
  <text x="1140" y="475" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5D4037">2) Steady state — telemetry ทุก 2 วินาที</text>

  <rect x="190" y="500" width="1375" height="346" fill="none" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="6,3" rx="4"/>
  <path d="M190,500 h70 v16 l-8,8 h-62 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="200" y="514" font-size="9.5" font-weight="bold" fill="#37474F">loop ทุก tick</text>

  <g font-size="10" fill="#212121">
    <line x1="790" y1="530" x2="965" y2="530" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="877" y="524" text-anchor="middle">publish factory/{id}/telemetry|job|alarm</text>

    <line x1="965" y1="562" x2="1140" y2="562" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="1052" y="556" text-anchor="middle">wildcard delivery factory/+/...</text>

    <text x="1140" y="580" text-anchor="middle" font-size="9.5">validate ด้วย Zod schema</text>
    <path d="M1140,588 h55 v20 h-55" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
  </g>

  <rect x="205" y="628" width="1345" height="196" fill="none" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="6,3" rx="4"/>
  <path d="M205,628 h50 v16 l-8,8 h-42 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="212" y="642" font-size="9.5" font-weight="bold" fill="#37474F">alt</text>
  <text x="290" y="646" font-size="9.5" font-style="italic" fill="#37474F">payload ผ่าน validation และเครื่อง active</text>

  <g font-size="10" fill="#212121">
    <line x1="1140" y1="674" x2="1315" y2="674" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="1227" y="668" text-anchor="middle">write telemetry / status_event / job / alarm</text>

    <line x1="1140" y1="706" x2="1490" y2="706" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="1315" y="700" text-anchor="middle">broadcast event</text>

    <line x1="1490" y1="738" x2="265" y2="738" stroke="#333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowMsg)"/>
    <text x="877" y="732" text-anchor="middle">push telemetry/job/alarm/status</text>
  </g>

  <line x1="205" y1="760" x2="1550" y2="760" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="212" y="774" font-size="9.5" font-style="italic" fill="#37474F">else เครื่องไม่ได้ลงทะเบียน/ถูก deactivate</text>

  <g font-size="10" fill="#212121">
    <text x="1140" y="792" text-anchor="middle" font-size="9.5">reject + log warning</text>
    <path d="M1140,800 h55 v20 h-55" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
  </g>

  <!-- ===== Phase 3: Watchdog ===== -->
  <rect x="365" y="878" width="1200" height="28" rx="4" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
  <text x="965" y="897" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5D4037">3) Watchdog — ตรวจ OFFLINE ทุก 5 วินาที</text>

  <rect x="190" y="922" width="1375" height="146" fill="none" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="6,3" rx="4"/>
  <path d="M190,922 h55 v16 l-8,8 h-47 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="197" y="936" font-size="9.5" font-weight="bold" fill="#37474F">loop ทุก 5s</text>

  <g font-size="10" fill="#212121">
    <line x1="440" y1="952" x2="1315" y2="952" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="877" y="946" text-anchor="middle">เช็ค last_seen_at ทุกเครื่อง</text>

    <line x1="440" y1="984" x2="1315" y2="984" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="877" y="978" text-anchor="middle">mark OFFLINE + insert status_event ถ้าเกิน threshold</text>

    <line x1="440" y1="1016" x2="1490" y2="1016" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="965" y="1010" text-anchor="middle">broadcast status</text>

    <line x1="1490" y1="1048" x2="265" y2="1048" stroke="#333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowMsg)"/>
    <text x="877" y="1042" text-anchor="middle">push status update</text>
  </g>

  <!-- ===== Phase 4: Dashboard query ===== -->
  <rect x="190" y="1100" width="1200" height="28" rx="4" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
  <text x="790" y="1119" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5D4037">4) Dashboard query — ERP / Production / Performance / KPI</text>

  <g font-size="10" fill="#212121">
    <line x1="265" y1="1158" x2="440" y2="1158" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="352" y="1152" text-anchor="middle">GET /erp/summary หรือ /maintenance/overview หรือ /kpi/summary</text>

    <line x1="440" y1="1190" x2="1315" y2="1190" stroke="#333" stroke-width="1.3" marker-end="url(#arrowMsg)"/>
    <text x="877" y="1184" text-anchor="middle" font-size="9.5">join machines + erp_machine_assets + production_jobs + product_skus + alarms + status_events</text>

    <line x1="1315" y1="1222" x2="440" y2="1222" stroke="#333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowMsg)"/>
    <text x="877" y="1216" text-anchor="middle">rows</text>

    <line x1="440" y1="1254" x2="265" y2="1254" stroke="#333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowMsg)"/>
    <text x="352" y="1248" text-anchor="middle">computed KPI / margin / downtime JSON</text>
  </g>

  <!-- ===== Participant footers (bottom, mirror of top) ===== -->
  <rect x="15" y="1290" width="150" height="45" rx="7" fill="#ECEFF1" stroke="#455A64" stroke-width="1.2"/>
  <text x="90" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">Admin</text>

  <rect x="190" y="1290" width="150" height="45" rx="7" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.2"/>
  <text x="265" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#4A148C">Dashboard</text>

  <rect x="365" y="1290" width="150" height="45" rx="7" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.2"/>
  <text x="440" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#33691E">REST API</text>

  <rect x="540" y="1290" width="150" height="45" rx="7" fill="#ECEFF1" stroke="#455A64" stroke-width="1.2"/>
  <text x="615" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">Docker</text>

  <rect x="715" y="1290" width="150" height="45" rx="7" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2"/>
  <text x="790" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D47A1">Simulator</text>

  <rect x="890" y="1290" width="150" height="45" rx="7" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.2"/>
  <text x="965" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">MQTT</text>

  <rect x="1065" y="1290" width="150" height="45" rx="7" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.2"/>
  <text x="1140" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#33691E">Subscriber</text>

  <rect x="1240" y="1290" width="150" height="45" rx="7" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="1315" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B5E20">PostgreSQL</text>

  <rect x="1415" y="1290" width="150" height="45" rx="7" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.2"/>
  <text x="1490" y="1317" text-anchor="middle" font-size="10" font-weight="bold" fill="#33691E">WebSocket</text>
</svg>
