# Render Blueprint for the read-only public demo.
#   Render Dashboard -> New -> Blueprint -> point at this repo.
#
# What you get: managed Postgres, an internal Mosquitto broker, the backend as a
# web service (TLS + WebSockets), the dashboard as a static site, and one
# simulator worker. Copy the simulator block for more machines.
#
# Cost note: web services and workers on the free plan sleep after ~15 min idle,
# which stops the live telemetry. For an always-on portfolio demo put `backend`
# and `simulator-01` on `starter`. Free Postgres is deleted after 30 days — use
# `starter` or an external Neon/Supabase database for anything long-lived.

databases:
  - name: production-monitoring-db
    plan: free # -> starter for a demo that must outlive 30 days
    databaseName: production_monitoring
    user: production_monitoring

envVarGroups:
  - name: demo-shared
    envVars:
      # Shared secret so simulators can self-register against the read-only
      # backend. Render generates it once and both sides below reference it.
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: REPO_URL
        value: https://github.com/your-username/production-monitoring

services:
  # --- MQTT broker (internal only) ----------------------------------------
  - type: pserv
    name: mqtt
    runtime: image
    plan: starter # private services have no free plan
    image:
      url: eclipse-mosquitto:2
    # allow_anonymous is already set in the image's default config; the demo
    # broker carries no sensitive data and is not reachable from outside.

  # --- Backend API + WebSocket -----------------------------------------------
  - type: web
    name: backend
    runtime: docker
    plan: free # -> starter so it doesn't sleep
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - fromGroup: demo-shared
      - key: DATABASE_URL
        fromDatabase:
          name: production-monitoring-db
          property: connectionString
      # Render's internal Mosquitto is fiddly (it must be detected listening on
      # a fixed port). A hosted broker is less hassle — swap in a HiveMQ Cloud
      # URL like mqtts://user:pass@xxx.s1.eu.hivemq.cloud:8883 and delete the
      # `mqtt` pserv below.
      - key: MQTT_BROKER_URL
        value: mqtt://mqtt:1883
      - key: BACKEND_WATCHDOG_OFFLINE_THRESHOLD_SEC
        value: "15"
      - key: DEMO_READ_ONLY
        value: "true"
      - key: DOCKER_MANAGEMENT_ENABLED
        value: "false"
      # Set after first deploy to the static site's URL, e.g.
      # https://production-monitoring-dashboard.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # --- Dashboard (static) --------------------------------------------------
  - type: web
    name: dashboard
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dashboard/dist
    rootDir: dashboard
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"
      - key: VITE_REPO_URL
        value: https://github.com/your-username/production-monitoring
      # Set after the backend's first deploy, using its onrender.com URL:
      #   VITE_API_BASE_URL = https://<backend>.onrender.com/api/v1
      #   VITE_WS_URL       = wss://<backend>.onrender.com/live
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Simulator (one machine; copy for more) -----------------------------
  - type: worker
    name: simulator-01
    runtime: docker
    plan: free # -> starter so it keeps publishing
    dockerfilePath: ./simulator/Dockerfile
    dockerContext: ./simulator
    envVars:
      - fromGroup: demo-shared
      - key: MACHINE_ID
        value: IMM-01
      - key: MACHINE_NAME
        value: Injection Molding Machine 01
      - key: MQTT_BROKER_URL
        value: mqtt://mqtt:1883
      - key: BACKEND_API_URL
        value: http://backend:10000/api/v1 # Render sets the web port to 10000
