# Render Blueprint for the fully static "หน้ากาก" demo (branch:
# deploy/render-static-mock).
#
# One free static site, no backend, no database, no broker. The dashboard runs
# on synthetic data generated in the browser (dashboard/src/lib/mock/*) with a
# fake live feed. Every write pops a dialog pointing at the main branch, which
# carries the real full stack.
#
#   Render Dashboard -> New -> Blueprint -> pick this repo, this branch.
#
# Nothing here needs configuring after deploy — it is self-contained.

services:
  - type: web
    name: production-monitoring-demo
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_MOCK
        value: "true"
      - key: VITE_REPO_URL
        value: https://github.com/your-username/production-monitoring
      # Where the "run it locally" dialog sends people. Point at main.
      - key: VITE_MAIN_BRANCH_URL
        value: https://github.com/your-username/production-monitoring/tree/main
    routes:
      # SPA fallback so deep links (/kpi, /admin, ...) resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
