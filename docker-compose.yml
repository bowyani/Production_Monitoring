name: production_monitoring

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      BACKEND_PORT: 3000
      BACKEND_WATCHDOG_OFFLINE_THRESHOLD_SEC: ${BACKEND_WATCHDOG_OFFLINE_THRESHOLD_SEC}
      # Lets Admin add/activate/deactivate a machine by controlling its
      # simulator container directly — see backend/src/docker/simulatorManager.ts.
      # Prototype-only convenience: a real PLC isn't a container we can start/stop.
      DOCKER_MANAGEMENT_ENABLED: "true"
      DOCKER_NETWORK: production_monitoring_default
      SIMULATOR_IMAGE: production-monitoring-simulator:latest
      SIMULATOR_MQTT_BROKER_URL: mqtt://mosquitto:1883
      SIMULATOR_BACKEND_API_URL: http://backend:3000/api/v1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  simulator-01:
    build: ./simulator
    image: production-monitoring-simulator:latest
    environment:
      MACHINE_ID: IMM-01
      MACHINE_NAME: Injection Molding Machine 01
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      BACKEND_API_URL: http://backend:3000/api/v1
    depends_on:
      backend:
        condition: service_healthy

  simulator-02:
    build: ./simulator
    image: production-monitoring-simulator:latest
    environment:
      MACHINE_ID: IMM-02
      MACHINE_NAME: Injection Molding Machine 02
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      BACKEND_API_URL: http://backend:3000/api/v1
    depends_on:
      backend:
        condition: service_healthy

  simulator-03:
    build: ./simulator
    image: production-monitoring-simulator:latest
    environment:
      MACHINE_ID: IMM-03
      MACHINE_NAME: Injection Molding Machine 03
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      BACKEND_API_URL: http://backend:3000/api/v1
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
